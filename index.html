<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMWOLFOX — Archive Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&family=Playfair+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #080808;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        .glass {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(138, 26, 26, 0.2);
        }

        .hidden-section {
            display: none;
            opacity: 0;
        }

        .red-accent {
            color: #9e1616;
        }

        .post-content blockquote {
            border-left: 2px solid #9e1616;
            padding-left: 1.5rem;
            margin: 2.5rem 0;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #d1d1d1;
            font-size: 1.2rem;
        }

        .post-content p {
            margin-bottom: 1.8rem;
            line-height: 1.8;
            color: #a1a1a1;
            font-weight: 300;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade {
            animation: fadeUp 1s forwards;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center">

    <!-- Welcome Gate Screen -->
    <div id="gate"
        class="glass p-12 rounded-[2.5rem] shadow-2xl max-w-sm w-full mx-4 text-center transition-all duration-1000">
        <div class="mb-8">
            <img src="amw-logo.png" alt="AMWOLFOX"
                onerror="this.src='https://via.placeholder.com/100/9e1616/ffffff?text=AMW'"
                class="w-24 mx-auto drop-shadow-[0_0_15px_rgba(138,26,26,0.6)]">
        </div>
        <h2 class="serif italic text-xl mb-8 tracking-[0.2em]">Private Protocol</h2>

        <!-- Action Button (Bypasses verification natively) -->
        <button onclick="unlock()"
            class="w-full py-4 bg-[#9e1616] hover:bg-red-700 text-white rounded-xl tracking-[0.3em] text-[10px] uppercase transition-all duration-500 shadow-lg shadow-red-900/20">
            Decrypt Archive
        </button>
    </div>

    <!-- Main UI Grid -->
    <div id="main-ui" class="hidden-section w-full max-w-6xl px-6 py-20 mx-auto">
        <header class="text-center mb-32">
            <div class="flex flex-col items-center justify-center">
                <div class="flex items-center justify-center gap-8 mb-6">
                    <img src="amw-logo.png" alt="AMW"
                        class="w-16 md:w-20 h-auto drop-shadow-[0_0_10px_rgba(138,26,26,0.8)]">
                </div>
                <p class="tracking-[0.6em] text-[10px] text-zinc-500 uppercase">AMWOLFOX Archive Protocol</p>
                
                <div class="w-16 h-px bg-red-900/50 mt-8"></div>
            </div>
        </header>

        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        </div>
    </div>

    <!-- Modal Viewport Overlay -->
    <div id="modal" class="fixed inset-0 bg-[#050505] z-50 hidden overflow-y-auto">
        <div class="max-w-3xl mx-auto px-6 py-24">
            <!-- Top Return Trigger -->
            <button onclick="closePost()"
                class="group text-zinc-500 hover:text-white mb-16 flex items-center gap-3 transition-all">
                <span class="text-2xl group-hover:-translate-x-2 transition-transform">←</span>
                <span class="text-[10px] uppercase tracking-[0.3em]">Return to Flux</span>
            </button>
            
            <div class="flex items-center gap-3 mb-4">
                <span id="m-date" class="text-red-800 text-[10px] tracking-[0.4em] uppercase block font-bold"></span>
                <span class="text-zinc-700">•</span>
                <span id="m-read-time" class="text-zinc-400 text-[10px] tracking-[0.35em] uppercase"></span>
            </div>
            <h1 id="m-title" class="text-4xl md:text-6xl serif mb-12 leading-tight"></h1>
            
            <!-- Dynamic HTML Content Target Layer -->
            <div id="m-content" class="post-content animate-fade"></div>

            <!-- Integrated Bottom Return Component -->
            <div class="mt-24 pt-8 border-t border-zinc-900/80">
                <button onclick="closePost()"
                    class="group text-zinc-500 hover:text-white flex items-center gap-3 transition-all">
                    <span class="text-2xl group-hover:-translate-x-2 transition-transform">←</span>
                    <span class="text-[10px] uppercase tracking-[0.3em]">Return to Flux</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const blogEntries = [
            {
                id: 0,
                date: "PROTOCOL 11.06.2026",
                title: "About Me",
                readTime: "1 min read",
                file: "posts/post-0.html"
            },
            {
                id: 1,
                date: "PROTOCOL 24.06.2026",
                title: "Know Yourself",
                readTime: "2 min read",
                file: "posts/post-1.html"
            },
            {
                id: 2,
                date: "PROTOCOL 01.07.2026",
                title: "Purpose of your Life",
                readTime: "3 min read",
                file: "posts/post-2.html"
            },
            {
                id: 3,
                date: "PROTOCOL 19.07.2026",
                title: "Gita: The Survival Instinct",
                readTime: "23 min read",
                file: "posts/post-3.html"
            },
            {
                
                id: 4,
                date: "PROTOCOL 12.10.2026",
                title: "The Art of Living with the Absurd",
                readTime: "5 min read",
                file: "posts/post-4.html"
            },
            {
                
                id: 5,
                date: "PROTOCOL 12.10.2026",
                title: "Movies",
                readTime: "2 min read",
                file: "posts/post-5.html"
            }
        ];

        function unlock() {
            const gate = document.getElementById('gate');
            gate.style.opacity = '0';
            gate.style.transform = 'translateY(-20px)';

            setTimeout(() => {
                gate.style.display = 'none';
                document.body.classList.remove('flex', 'items-center', 'justify-center');
                const main = document.getElementById('main-ui');
                main.style.display = 'block';
                render();
                setTimeout(() => main.classList.add('animate-fade'), 50);
            }, 800);
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = ""; 

            blogEntries.forEach(p => {
                grid.innerHTML += `
                    <div onclick="showPost(${p.id})" class="glass p-10 rounded-[2.5rem] cursor-pointer border-white/5 hover:border-red-900/50 transition-all duration-700 group">
                        <span class="text-[10px] text-red-900 tracking-[0.3em] font-bold uppercase">${p.date}</span>
                        <h3 class="serif text-2xl mt-6 group-hover:text-red-700 transition-colors duration-500">${p.title}</h3>
                        <p class="text-[10px] uppercase tracking-[0.35em] text-zinc-500 mt-4">${p.readTime}</p>
                        <div class="w-8 h-px bg-zinc-800 mt-6 group-hover:w-16 group-hover:bg-red-900 transition-all duration-700"></div>
                        <p class="text-zinc-500 text-xs mt-6 line-clamp-2 leading-relaxed uppercase tracking-widest font-light">Decrypting internal data stream...</p>
                    </div>
                `;
            });
        }

        async function showPost(id) {
            const p = blogEntries.find(x => x.id === id);
            if (!p) return;

            document.getElementById('m-title').innerText = p.title;
            document.getElementById('m-date').innerText = p.date;
            document.getElementById('m-read-time').innerText = p.readTime;
            try {
                const res = await fetch(p.file);
                if (!res.ok) throw new Error('Failed to load post');
                const html = await res.text();
                const content = document.getElementById('m-content');
                content.innerHTML = html;

                const scripts = content.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.replaceWith(newScript);
                });
            } catch (e) {
                console.error('Error loading post:', e);
                document.getElementById('m-content').innerHTML = `<p class="text-red-500 text-xs tracking-widest font-mono uppercase">Unable to load post content.</p>`;
            }
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            // Auto-scroll modal space back to absolute top on load pass
            document.getElementById('modal').scrollTop = 0;
        }

        function closePost() {
            document.getElementById('modal').classList.add('hidden');
            if(document.getElementById('gate').style.display === 'none') {
                document.body.style.overflow = 'auto';
            }
        }
    </script>
</body>

</html>

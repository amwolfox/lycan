<p>Here is the archive of the films I have watched, sorted by feeling and reaction. The ratings are grouped into the
    categories I actually use: Best, Good, Average, Poor, and Pending.</p>
<p class="text-[10px] tracking-[0.35em] uppercase text-zinc-400 mb-8">Total Movies: <span id="total-movies-count">0</span></p>

<script>
(async function () {
    const container = document.getElementById("movie-categories");
    const totalNode = document.getElementById("total-movies-count");

    try {
        const response = await fetch("movies.json");
        if (!response.ok) throw new Error("Failed to load movies");

        const categories = await response.json();
        const totalMovies = Object.values(categories).reduce((sum, movies) => sum + movies.length, 0);
        totalNode.textContent = String(totalMovies);

        Object.entries(categories).forEach(([name, movies]) => {
            const listId = name.toLowerCase() + "-list";
            const section = document.createElement("section");
            section.className = "mb-12 border-l border-zinc-800 hover:border-red-900/50 transition-colors pl-6";

            const button = document.createElement("button");
            button.className = "dropdown-toggle w-full flex items-center justify-between text-left text-[12px] sm:text-sm tracking-[0.2em] font-mono text-[#B91C1C] mb-4 font-extrabold uppercase";
            button.type = "button";
            button.dataset.target = listId;

            const label = document.createElement("span");
            label.textContent = name + " (" + movies.length + ")";
            const arrow = document.createElement("span");
            arrow.className = "dropdown-arrow text-lg leading-none";
            arrow.textContent = "+";
            button.append(label, arrow);

            const list = document.createElement("ul");
            list.id = listId;
            list.className = "dropdown-content hidden m-0 p-0 list-none space-y-2";
            movies.forEach((title) => {
                const item = document.createElement("li");
                item.className = "text-zinc-300 text-sm md:text-base";
                item.textContent = title;
                list.appendChild(item);
            });

            button.addEventListener("click", () => {
                const isHidden = list.classList.contains("hidden");
                container.querySelectorAll(".dropdown-content").forEach((otherList) => {
                    if (otherList !== list) otherList.classList.add("hidden");
                });
                container.querySelectorAll(".dropdown-arrow").forEach((otherArrow) => {
                    if (otherArrow !== arrow) otherArrow.textContent = "+";
                });
                list.classList.toggle("hidden", !isHidden);
                arrow.textContent = isHidden ? "−" : "+";
            });

            section.append(button, list);
            container.appendChild(section);
        });
    } catch (error) {
        container.textContent = "Unable to load the movie archive.";
        console.error("Error loading movies:", error);
    }
})();
</script>
